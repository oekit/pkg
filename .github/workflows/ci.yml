name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.24'

  # 零第三方依赖硬规则：go.mod 零 require，全部子包仅依赖标准库。
  # 管策略（tidy -diff 门禁只管一致性）；违反即红，分支保护 required check。
  zero-dep:
    name: Zero Third-Party Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: go list -m all 仅允许本模块一行
        run: |
          n=$(GOWORK=off go list -m all | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::pkg 零第三方依赖硬规则被违反：go list -m all 共 $n 行（仅允许本模块 1 行）"
            GOWORK=off go list -m all
            exit 1
          fi
