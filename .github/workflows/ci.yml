name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.26'

  # 零第三方依赖硬规则：go.mod 零 require，全部子包仅依赖标准库。
  # 管策略（tidy -diff 门禁只管一致性）；违反即红，分支保护 required check。
  zero-dep:
    name: Zero Third-Party Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go list -m all 仅允许本模块一行
        run: |
          n=$(GOWORK=off go list -m all | wc -l | tr -d ' ')
          if [ "$n" -ne 1 ]; then
            echo "::error::pkg 零第三方依赖硬规则被违反：go list -m all 共 $n 行（仅允许本模块 1 行）"
            GOWORK=off go list -m all
            exit 1
          fi

  # API 生命周期门禁：api-lifecycle.yaml 清单 ↔ 包注释标记 ↔ 生产包集合，
  # 三处一致才绿（新增包未登记 / level 与标记不一致 / 标记缺失或重复 ⇒ 红）。
  #
  # 为什么判据脚本住在 matrix-tools 而不是本仓：pkg 是**零第三方依赖仓**
  # （上面 zero-dep job 强制 go list -m all 只 1 行），解析 YAML 需要 pyyaml
  # ⇒ 门禁若住在本仓就破那条红线。判定逻辑放治理仓，本仓只留声明面
  # （清单 + 包注释标记 + docs/api-compat.md），消费方依赖图不受影响。
  # 与 oekit/oekit 的 BOM 新鲜度门禁同范式。
  api-lifecycle:
    name: API Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 取判据脚本（治理仓 matrix-tools）
        # 先试 matrix-tools 的门禁分支（判据本体尚在 PR 阶段的窗口期），
        # 取不到再退 main（判据已合入后的常态）。两处都取不到 ⇒ 本 job 判红——
        # **判不了 ≠ 通过**。
        #
        # 每个 ref 克隆到**不同目录名**：失败时不必删目录——「删了再克隆」
        # 在某些沙箱里会被权限门拦，而「换个名字」不会。目录在 workspace 之内
        # （actions/checkout 会校验，用 ../ 会直接报错）；里面是 .py 仓
        # （matrix-tools 无 Go 文件）⇒ 不影响本仓的 go build/vet。
        run: |
          set -euo pipefail
          ok=""
          for ref in feat/pkg-api-lifecycle-gate main; do
            dir="matrix-tools-$ref"
            if git clone --depth 1 --branch "$ref" https://github.com/oekit/matrix-tools.git "$dir" 2>/dev/null; then
              if [ -f "$dir/scripts/api_lifecycle_gate.py" ]; then
                echo "::notice::判据取自 matrix-tools@$ref"
                ok="$dir"
                break
              fi
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::取不到 API 生命周期判据脚本（两个 ref 都失败）——判不了 ≠ 通过"
            exit 1
          fi
          echo "GATE_DIR=$ok" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 门禁判据（清单 ↔ 包注释 ↔ 生产包集合）
        run: python3 "$GATE_DIR/scripts/api_lifecycle_gate.py" --repo .
      - name: 判据自测（门禁自己抓得住各类漂移）
        run: python3 "$GATE_DIR/scripts/api_lifecycle_gate_selftest.py"
